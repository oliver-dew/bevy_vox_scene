[workspace]
resolver = "3"
members = [
    "bevy_vox_processor",
    "flipbook",
    "vox_bake",
    "vox-to-gltf",
]

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false }

[package]
name = "bevy_vox_scene"
description = "A Bevy engine plugin for loading Magica Voxel world files and render materials directly in Bevy as a scene graph."
keywords = ["bevy", "voxel", "Magica-Voxel"]
categories = ["game-development", "graphics", "rendering", "rendering::data-formats"]
license = "MIT"
version = "0.23.0"
repository = "https://github.com/Utsira/bevy_vox_scene"
authors = ["Oliver Dew <olidew@gmail.com>"]
edition = "2024"
readme = "README.md"
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[profile.dev]
opt-level = 1

[profile.dev.package.vox_bake]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[features]
default = ["modify_voxels", "generate_voxels", "pbr_transmission_textures"]
modify_voxels = []
generate_voxels = []
pbr_transmission_textures = ["bevy/pbr_transmission_textures"]
webgl2 = ["bevy/webgl2"]
webgpu = []
export = ["vox_bake/gltf"]

[dependencies]
bevy = {
    workspace = true,
    features = [
        "bevy_render",
        "bevy_world_serialization",
        "bevy_asset",
        "bevy_animation",
        "bevy_pbr",
        "bevy_log",
        "png",
    ],
}
anyhow = "1.0.38"
thiserror = "2.0.12"
serde = "1.0.219"
vox_bake = { version = "0.1.0", path = "vox_bake" }
flipbook = { package = "bevy_flipbook", version = "0.1.0", path = "flipbook" }

[dev-dependencies]
bevy = { workspace = true, features = ["3d", "dev", "pbr_transmission_textures"] }
rand = "0.9.0"
libnoise = "1.2"
rayon = "1.12"
